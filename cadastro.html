<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Cadastre-se na AUma Gêmea e participe das nossas ações de adoção, doação e voluntariado.">

    <title>Cadastro | AUma Gêmea</title>
</head>

<body>

    <header>
        <h1>Cadastro AUma Gêmea</h1>

        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Faça parte da AUma Gêmea</h2>

            <p>
                Preencha seus dados para se cadastrar e acompanhar
                nossas ações.
            </p>

            <form action="#" method="post">

                <!-- Dados pessoais -->
                <fieldset>
                    <legend>Dados pessoais</legend>

                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="nascimento">Data de nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00"
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" title="Digite o CPF no formato 000.000.000-00"
                        required>

                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999"
                        pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" title="Digite o telefone no formato (11) 99999-9999"
                        required>
                </fieldset>

                <!-- Endereço -->
                <fieldset>
                    <legend>Endereço</legend>

                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" required>

                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000" pattern="[0-9]{5}-[0-9]{3}"
                        title="Digite o CEP no formato 00000-000" required>

                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>

                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado" required>
                        <option value="">Selecione</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="ES">Espírito Santo</option>
                    </select>
                </fieldset>

                <!-- Interesse -->
                <fieldset>
                    <legend>Como deseja participar?</legend>

                    <input type="radio" id="adocao" name="interesse" value="adocao" required>
                    <label for="adocao">Adoção</label>

                    <input type="radio" id="voluntariado" name="interesse" value="voluntariado">
                    <label for="voluntariado">Voluntariado</label>

                    <input type="radio" id="doacao" name="interesse" value="doacao">
                    <label for="doacao">Doação</label>
                </fieldset>

                <button type="submit">Enviar cadastro</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 AUma Gêmea. Todos os direitos reservados.</p>
    </footer>

</body>

</html>
